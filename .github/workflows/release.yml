name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SnipClip ${{ github.ref_name }}
          releaseBody: |
            ## Install

            - **Windows:** NSIS `.exe`, `.msi`, or **portable `.zip`** (no install — unzip and run `SnipClip.exe`)
            - **Linux:** `.AppImage` and `.deb`

            WebView2 is required on Windows and is already on most Windows 10/11 PCs.

            ## What's new

            See [CHANGELOG.md](https://github.com/Ander507/SnipClip/blob/master/CHANGELOG.md) for full release notes.

            **Quick try:** install → copy something → `Ctrl+Shift+V` for the vault → `Alt+C` for the paste palette → `Ctrl+Shift+S` / `Ctrl+Shift+R` on any monitor.

            Multi-monitor snip/record and the in-app video editor (trim / crop / mute / GIF) are included.

            The auto-updater uses `latest.json` from this release (installers only).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $src = "src-tauri/target/release"
          $stage = "SnipClip-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$src/snipclip.exe" "$stage/SnipClip.exe"
          Get-ChildItem "$src/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $stage
          if (Test-Path "$src/resources") {
            Copy-Item "$src/resources" "$stage/resources" -Recurse
          }
          $zip = "SnipClip_${version}_x64_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload Windows portable to release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "SnipClip_${version}_x64_portable.zip"
          gh release upload "${{ github.ref_name }}" $zip --clobber
