name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SnipClip ${{ github.ref_name }}
          releaseBody: |
            ## What's New in ${{ github.ref_name }}

            Full notes: [CHANGELOG.md](https://github.com/Ander507/SnipClip/blob/master/CHANGELOG.md).

            ### Highlights

            - Small cleanup on hotkey registration — clearer conflict messages, same Win+V popup / snip fixes from 1.6.0.

            **Quick try:** install → copy something → `Ctrl+Shift+D` (or `Alt+C`) → Enter to paste → `Ctrl+Shift+S` / `Ctrl+Shift+R` on any monitor.

            ### Installation (pick one)

            Prefer these if SmartScreen / antivirus is noisy:

            1. **`.msi` (WiX)** — Windows Installer package (usually treated more calmly than NSIS self-extractors)
            2. **Portable `.zip`** — unzip and run `SnipClip.exe` (no installer)
            3. **NSIS `.exe`** — classic setup; fine for most people

            Linux: `.AppImage` or `.deb`. WebView2 is required on Windows (already on most Win10/11 PCs).

            ### Antivirus & SmartScreen notice

            SnipClip is **100% open-source** and built from Rust + Tauri source. This is an **unsigned community build** with clipboard monitoring, global hotkeys, and GDI screen capture — capabilities that heuristic models often score as generic PUA even when Microsoft Defender is clean.

            - Prefer the **`.msi`** or **portable `.zip`** if the NSIS setup is flagged.
            - Builds are **not** packed with UPX or other binary packers.
            - SmartScreen workaround: **More info** → **Run anyway**, or clone the repo and run `npm run tauri build` yourself.
            - After the Windows job finishes, this release gets an NSIS **SHA-256** and **VirusTotal** link appended below.

            The auto-updater uses `latest.json` from this release (installers only).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Never add UPX or other packers here — they spike false-positive rates on VirusTotal.
      - name: Append NSIS SHA-256 to release notes
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) {
            Write-Host "No NSIS setup.exe found — skip checksum"
            exit 0
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $body = gh release view $tag --json body -q .body
          if ($body -match [regex]::Escape($hash)) {
            Write-Host "SHA already present in release notes"
            exit 0
          }
          $extra = @"

          - **SHA-256** (``$($exe.Name)``): ``$hash``
          - **VirusTotal:** [Scan report](https://www.virustotal.com/gui/file/$hash) (upload the setup exe once if the page is empty)
          "@
          $combined = ($body.TrimEnd() + "`n" + $extra)
          $tmp = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $tmp -Value $combined -Encoding utf8
          gh release edit $tag --notes-file $tmp
          Write-Host "Appended SHA-256 $hash"

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $src = "src-tauri/target/release"
          $stage = "SnipClip-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$src/snipclip.exe" "$stage/SnipClip.exe"
          Get-ChildItem "$src/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $stage
          if (Test-Path "$src/resources") {
            Copy-Item "$src/resources" "$stage/resources" -Recurse
          }
          $zip = "SnipClip_${version}_x64_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload Windows portable to release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "SnipClip_${version}_x64_portable.zip"
          gh release upload "${{ github.ref_name }}" $zip --clobber
